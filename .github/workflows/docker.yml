name: Docker image
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sallos725/risu-multiagent-full:${{ github.ref_name }}
            ghcr.io/sallos725/risu-multiagent-full:latest
          labels: |
            org.opencontainers.image.title=MARP Full
            org.opencontainers.image.source=https://github.com/Sallos725/MARP
            org.opencontainers.image.revision=${{ github.sha }}
