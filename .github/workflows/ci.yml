name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r full/requirements.txt

      - name: Check Python syntax
        run: python -m compileall full/app

      - name: Check plugin JavaScript syntax
        run: |
          node --check lite/risu-multiagent.js
          node --check full/plugin/risu-multiagent-full.js

      - name: Smoke test FastAPI app
        env:
          CONFIG_PATH: /tmp/risu-multiagent-ci/config.json
          PYTHONPATH: full
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              response = client.get("/health")
              assert response.status_code == 200, response.text
              assert response.json() == {"status": "ok"}
          PY

      - name: Build Docker image
        run: docker build -t risu-multiagent-full:ci full
