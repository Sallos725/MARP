name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: full/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build && git diff --exit-code -- lite/risu-multiagent.js full/plugin/risu-multiagent-full.js
      - run: npm test && npm run check:size
      - run: go -C full test -race ./...
      - run: go -C full vet ./...
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: python3 -m pip install pypdf
      - name: Check PDF Unicode extraction
        run: |
          MARP_PDF_FIXTURE=/tmp/marp-go.pdf go -C full test ./internal/marp -run TestPDFUnicode -count=1
          MARP_PDF_FIXTURE=/tmp/marp-js.pdf node --test tests/pdf.test.mjs
          python3 tests/check_pdf.py /tmp/marp-go.pdf /tmp/marp-js.pdf
      - run: python3 scripts/package.py v0.9.0
      - run: python3 tests/measure_server.py
      - run: python3 tests/install_package.py dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: full
          platforms: linux/amd64,linux/arm64
          push: false
      - uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: test-results/
