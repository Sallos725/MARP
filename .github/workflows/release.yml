name: Release packages
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: full/go.sum
      - run: python3 scripts/package.py
      - run: python3 .github/scripts/build_release_notes.py
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/multiagent-* dist/marp-*-linux-* dist/SHA256SUMS --verify-tag --target "$GITHUB_SHA" --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md
