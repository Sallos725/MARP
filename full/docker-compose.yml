services:
  risu-multiagent:
    image: ${MULTIAGENT_IMAGE:-ghcr.io/sallos725/risu-multiagent-full:${MULTIAGENT_VERSION:-latest}}
    pull_policy: missing
    build:
      context: .
    ports:
      - "6009:6009"
    env_file:
      - .env
    volumes:
      - ./data:/data
    environment:
      - CONFIG_PATH=/data/config.json
    restart: unless-stopped
